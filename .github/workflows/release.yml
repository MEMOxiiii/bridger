name: Release

# Builds the portable Windows zip and the Linux/macOS command-line archives for a version tag (docs/release.md,
# steps 8-9) and publishes the GitHub release with the matching docs/CHANGELOG.md section.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VCPKG_TAG: "2026.07.29"
  BRIDGER_VCPKG_DIR: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
  VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
  VCPKG_DISABLE_METRICS: "1"
  # Pinned in tools/mapgen/fetch_sources.py; their data is compiled into the mapping blob.
  GEYSER_COMMIT: "50a464d7db132ca5943b608a2110c158bf09702a"
  MCDATA_COMMIT: "dd01127457231e7da629d645b3c6738068018eb0"

jobs:
  # Linux and macOS: the desktop app and the command line (docs/adr/0010), bridger-<version>-<os>.tar.gz + .sha256.
  posix:
    name: package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
    env:
      # macOS: run on 13.3 and later (the oldest with the C++20 library features Bridger uses), dependencies included.
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      VCPKG_KEEP_ENV_VARS: MACOSX_DEPLOYMENT_TARGET
      # Vulkan for the macOS app (shipped in Bridger.app); the hash is GitHub's digest of the release asset.
      MOLTENVK_VERSION: "v1.4.2"
      MOLTENVK_SHA256: "f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/ui/package-lock.json

      - name: Install build tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q ninja-build zip unzip pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
              mesa-vulkan-drivers xvfb xauth dbus-x11
          else
            brew install ninja pkg-config
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ matrix.os }}-release-pkg
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ matrix.os }}-
            vcpkg-${{ env.VCPKG_TAG }}-${{ matrix.os }}-

      - name: Bootstrap vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS"
          git -c advice.detachedHead=false clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg.git "$BRIDGER_VCPKG_DIR"
          "$BRIDGER_VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$BRIDGER_VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Configure, build, test
        run: |
          # Linux: libstdc++ and libgcc linked in, so the binaries need only glibc (and GTK/WebKitGTK for the app).
          extra=()
          if [ "$RUNNER_OS" = "Linux" ]; then extra=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"); fi
          cmake --preset posix-release "${extra[@]}"
          cmake --build --preset posix-release
          ctest --preset posix-release

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="bridger-$version-${{ matrix.name }}"
          dir="dist/$name"
          bin=build/posix-release/bin
          mkdir -p "$dir/licenses"
          cp "$bin/bridger" "$dir/"
          strip "$dir/bridger"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp "$bin/bridger-gui" "$dir/"
            strip "$dir/bridger-gui"
          else
            # Bridger.app with MoltenVK inside (Contents/Frameworks, loaded directly; docs/adr/0010).
            cp -R "$bin/Bridger.app" "$dir/"
            curl -sSfL "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar" -o moltenvk.tar
            echo "$MOLTENVK_SHA256  moltenvk.tar" | shasum -a 256 -c -
            tar -xf moltenvk.tar MoltenVK/LICENSE MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
            mkdir -p "$dir/Bridger.app/Contents/Frameworks"
            cp MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib "$dir/Bridger.app/Contents/Frameworks/"
            cp MoltenVK/LICENSE "$dir/licenses/moltenvk.txt"
            strip -x "$dir/Bridger.app/Contents/MacOS/Bridger"
            # Not signed with a developer identity (docs/adr/0010): an ad-hoc signature, which Apple Silicon requires.
            codesign --force --deep --sign - "$dir/Bridger.app"
            codesign --force --sign - "$dir/bridger"
          fi
          cp README.md docs/CHANGELOG.md docs/THIRD_PARTY.md "$dir/"
          cp LICENSE "$dir/licenses/bridger-MPL-2.0.txt"
          share=$(dirname "$(ls -d build/vcpkg_installed_*/*/share/zlib | head -1)")
          for port in libdeflate minizip-ng zlib tbb tl-expected xxhash spdlog fmt cli11 \
                      glm volk vk-bootstrap vulkan-memory-allocator stb nlohmann-json; do
            [ -f "$share/$port/copyright" ] || { echo "missing license for $port"; exit 1; }
            cp "$share/$port/copyright" "$dir/licenses/$port.txt"
          done
          cp third_party/leveldb-mcpe/LICENSE "$dir/licenses/leveldb-mcpe.txt"
          # The app's embedded web interface (docs/THIRD_PARTY.md, "Web user interface").
          npm=src/app/ui/node_modules
          for pkg in react react-dom scheduler lenis @fontsource-variable/inter @fontsource/jetbrains-mono; do
            [ -f "$npm/$pkg/LICENSE" ] || { echo "missing license for $pkg"; exit 1; }
            cp "$npm/$pkg/LICENSE" "$dir/licenses/npm-$(echo "$pkg" | tr '@/' '--' | sed 's/^-*//').txt"
          done
          # GSAP ships no license file; its license is the Standard "no charge" license, published online.
          { echo "GSAP $(node -p "require('./$npm/gsap/package.json').version") and @gsap/react $(node -p "require('./$npm/@gsap/react/package.json').version")"
            echo "Copyright (c) 2008-2026, GreenSock / Webflow. All rights reserved."
            echo "Used under the GSAP Standard 'no charge' license: https://gsap.com/standard-license"
          } > "$dir/licenses/npm-gsap.txt"
          cp tools/mapgen/sources/geyser-mappings/LICENSE "$dir/licenses/geysermc-mappings.txt"
          curl -sSfL "https://raw.githubusercontent.com/GeyserMC/Geyser/$GEYSER_COMMIT/LICENSE" -o "$dir/licenses/geysermc-geyser.txt"
          # minecraft-data has no LICENSE file; its README states the license. Ship that section verbatim.
          { echo "PrismarineJS/minecraft-data, commit $MCDATA_COMMIT (data/pc/common/legacy.json)"
            echo "https://github.com/PrismarineJS/minecraft-data"; echo "License section of its README:"; echo
            curl -sSfL "https://raw.githubusercontent.com/PrismarineJS/minecraft-data/$MCDATA_COMMIT/README.md" | tr -d '\r' | grep -A6 -x '## License'
          } > "$dir/licenses/minecraft-data.txt"
          grep -q '## License' "$dir/licenses/minecraft-data.txt" || { echo "minecraft-data README has no License section"; exit 1; }
          "$dir/bridger" --version
          if [ "$RUNNER_OS" = "Linux" ]; then
            "$dir/bridger-gui" --version
            for exe in bridger bridger-gui; do
              # Direct dependencies only (WebKit itself brings its own libstdc++ to the app's process).
              ! readelf -d "$dir/$exe" | grep NEEDED | grep -q 'libstdc++' || { echo "libstdc++ must be linked into $exe"; exit 1; }
              echo "$exe: newest glibc symbol $(objdump -T "$dir/$exe" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
            done
          else
            "$dir/Bridger.app/Contents/MacOS/Bridger" --version
            otool -L "$dir/bridger" "$dir/Bridger.app/Contents/MacOS/Bridger"
            vtool -show-build "$dir/bridger" | grep -E 'minos|platform'
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "DIR=$dir" >> "$GITHUB_ENV"

      - name: Smoke test the packaged app
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          file="$PWD/tests/data/ingame/containers.schem"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 # WebKit's sandbox needs user namespaces
            timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- "$DIR/bridger-gui" --smoke-test=1 "$file"
          else
            timeout 300 "$DIR/Bridger.app/Contents/MacOS/Bridger" --smoke-test=1 "$file"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: posix
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The desktop app's interface is built with npm (src/app/ui, docs/adr/0009).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/ui/package-lock.json

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-msvc-release
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-${{ env.VCPKG_TAG }}-

      - name: Restore vcpkg tool downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-${{ env.VCPKG_TAG }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE, $env:VCPKG_DOWNLOADS | Out-Null
          git -c advice.detachedHead=false clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg.git $env:BRIDGER_VCPKG_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:BRIDGER_VCPKG_DIR\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:BRIDGER_VCPKG_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cm = Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1
          $version = $cm.Matches[0].Groups[1].Value
          $vcpkg = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'version-semver'
          "tag $tag, CMakeLists $version, vcpkg.json $vcpkg"
          if ($tag -ne $version -or $tag -ne $vcpkg) { throw "version mismatch" }

      - name: Configure, build, test
        shell: pwsh
        run: |
          cmake --preset msvc-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset msvc-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset msvc-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $name = "bridger-$version-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item build/msvc-release/bin/bridger.exe, build/msvc-release/bin/bridger-gui.exe $dir
          # MSVC runtime, deployed next to the exe (app-local deployment of the Visual C++
          # redistributable files); the Universal CRT is part of Windows 10 and later.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") { Copy-Item (Join-Path $crt.FullName $dll) $dir }
          Copy-Item README.md, docs/CHANGELOG.md, docs/THIRD_PARTY.md $dir
          Copy-Item LICENSE "$dir/licenses/bridger-MPL-2.0.txt"
          # Shipped libraries (docs/THIRD_PARTY.md, "Shipped: yes"): their vcpkg copyright files.
          $share = "build/vcpkg_installed/x64-windows-static-md/share"
          foreach ($port in "libdeflate", "minizip-ng", "zlib", "tbb", "tl-expected", "xxhash", "spdlog", "fmt", "cli11",
                            "glm", "volk", "vk-bootstrap", "vulkan-memory-allocator", "stb", "nlohmann-json", "sdl3", "webview2", "wil") {
            $src = Join-Path $share "$port/copyright"
            if (-not (Test-Path $src)) { throw "missing license for $port" }
            Copy-Item $src "$dir/licenses/$port.txt"
          }
          Copy-Item third_party/leveldb-mcpe/LICENSE "$dir/licenses/leveldb-mcpe.txt"
          # The app's embedded web interface (docs/THIRD_PARTY.md, "Web user interface").
          $npm = "src/app/ui/node_modules"
          foreach ($pkg in "react", "react-dom", "scheduler", "lenis", "@fontsource-variable/inter", "@fontsource/jetbrains-mono") {
            $src = Join-Path $npm "$pkg/LICENSE"
            if (-not (Test-Path $src)) { throw "missing license for $pkg" }
            Copy-Item $src ("$dir/licenses/npm-" + ($pkg -replace "[@/]", "-").Trim("-") + ".txt")
          }
          # GSAP ships no license file; its license is the Standard "no charge" license, published online.
          Set-Content -Encoding utf8 "$dir/licenses/npm-gsap.txt" @(
            "GSAP $((Get-Content $npm/gsap/package.json -Raw | ConvertFrom-Json).version) and @gsap/react $((Get-Content $npm/@gsap/react/package.json -Raw | ConvertFrom-Json).version)",
            "Copyright (c) 2008-2026, GreenSock / Webflow. All rights reserved.",
            "Used under the GSAP Standard 'no charge' license: https://gsap.com/standard-license")
          Copy-Item tools/mapgen/sources/geyser-mappings/LICENSE "$dir/licenses/geysermc-mappings.txt"
          Invoke-WebRequest "https://raw.githubusercontent.com/GeyserMC/Geyser/$env:GEYSER_COMMIT/LICENSE" -OutFile "$dir/licenses/geysermc-geyser.txt"
          # minecraft-data has no LICENSE file; its README states the license. Ship that section verbatim.
          $readme = (Invoke-WebRequest "https://raw.githubusercontent.com/PrismarineJS/minecraft-data/$env:MCDATA_COMMIT/README.md").Content -split "`n"
          $at = [array]::FindIndex($readme, [Predicate[string]] { param($l) $l.Trim() -eq "## License" })
          if ($at -lt 0) { throw "minecraft-data README has no License section" }
          $notice = @("PrismarineJS/minecraft-data, commit $env:MCDATA_COMMIT (data/pc/common/legacy.json)",
                      "https://github.com/PrismarineJS/minecraft-data", "License section of its README:", "") + $readme[$at..($at + 6)]
          Set-Content -Encoding utf8 "$dir/licenses/minecraft-data.txt" $notice
          # Docs step 8: never ship the Vulkan loader.
          if (Get-ChildItem $dir -Recurse -Filter "vulkan-1.dll") { throw "vulkan-1.dll must not be shipped" }
          & "$dir/bridger.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gui = Start-Process -FilePath "$dir/bridger-gui.exe" -ArgumentList "--version" -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "bridger-gui.exe --version failed" }
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The SHA-256 next to the zip (sha256sum format), for the desktop app's updater (docs/app/updates.md).
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n", [System.Text.Encoding]::ASCII)
          "SHA=dist/$name.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Release notes from docs/CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content -Encoding utf8 docs/CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "docs/CHANGELOG.md has no section for $version" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $section = if ($end) { $rest[0..($end - 2)] } else { $rest }
          Set-Content -Encoding utf8 dist/notes.md $section

      - name: Download the Linux and macOS packages
        uses: actions/download-artifact@v4
        with:
          path: dist/posix
          merge-multiple: true

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $posix = Get-ChildItem dist/posix -File | ForEach-Object { $_.FullName }
          if ($posix.Count -ne 4) { throw "expected 4 Linux/macOS files, found $($posix.Count)" }
          gh release create "${{ github.ref_name }}" $env:ZIP $env:SHA @posix --title "Bridger ${{ github.ref_name }}" --notes-file dist/notes.md --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
