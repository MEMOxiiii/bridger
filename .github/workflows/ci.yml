name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with vcpkg-configuration.json ("reference").
  VCPKG_TAG: "2026.07.29"
  # Not VCPKG_ROOT: the VS developer environment overwrites that with VS's bundled
  # (too old) vcpkg. The bootstrap step exports VCPKG_ROOT after msvc-dev-cmd runs.
  BRIDGER_VCPKG_DIR: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: msvc-asan        # unit tests under AddressSanitizer
            test: true
          - preset: msvc-release     # unit tests + benchmark smoke run
            test: true
            bench: true
          - preset: clangcl-release  # second compiler
            test: true
          - preset: msvc-debug       # build only
          - preset: clangcl-fuzz     # build fuzzers + short smoke run
            fuzz: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ matrix.preset }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-${{ env.VCPKG_TAG }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT before override: $env:VCPKG_ROOT" | Tee-Object -Append ci-step.log
          git -c advice.detachedHead=false clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg.git $env:BRIDGER_VCPKG_DIR 2>&1 | Tee-Object -Append ci-step.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:BRIDGER_VCPKG_DIR\bootstrap-vcpkg.bat" -disableMetrics 2>&1 | Tee-Object -Append ci-step.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:BRIDGER_VCPKG_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check clang-cl
        if: startsWith(matrix.preset, 'clangcl')
        shell: pwsh
        run: clang-cl --version

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} 2>&1 | Tee-Object -Append ci-step.log
          exit $LASTEXITCODE

      - name: Build
        shell: pwsh
        run: |
          # -k 0: keep going after a failure so one run reports every compile error.
          cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | Tee-Object -Append ci-step.log
          exit $LASTEXITCODE

      - name: Test
        if: matrix.test
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} 2>&1 | Tee-Object -Append ci-step.log
          exit $LASTEXITCODE

      - name: Benchmark smoke run
        if: matrix.bench
        shell: pwsh
        run: |
          Get-ChildItem build/${{ matrix.preset }}/bin/bridger_bench_*.exe | ForEach-Object {
            & $_.FullName --benchmark_min_time=0.05s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Fuzz smoke run (30 s per target)
        if: matrix.fuzz
        shell: pwsh
        run: |
          # Seeds per target (read-only); new inputs go to a scratch corpus dir.
          $seeds = @{ nbt = @('tests/data/nbt'); schem = @('tests/data/schem', 'tests/data/schem/malformed') }
          Get-ChildItem build/${{ matrix.preset }}/bin/bridger_fuzz_*.exe | ForEach-Object {
            $name = $_.BaseName -replace '^bridger_fuzz_', ''
            $corpus = "fuzz-corpus/$name"
            New-Item -ItemType Directory -Force $corpus | Out-Null
            # Arrays passed to a native command expand to one argument per element.
            [string[]]$extra = @()
            if ($seeds.ContainsKey($name)) { $extra = $seeds[$name] }
            & $_.FullName $corpus $extra -max_total_time=30 -print_final_stats=1 2>&1 | Tee-Object -Append ci-step.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Job logs need a signed-in account; annotations are public. Surface the error lines.
      - name: Report failure as annotation
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path ci-step.log)) { "::error title=${{ matrix.preset }}::failed before any logged step"; exit 0 }
          $lines = Get-Content ci-step.log
          # Unique compiler/linker diagnostics first (the same header error repeats per TU).
          $hits = $lines | Select-String -Pattern 'error[ :]|FAILED|fatal|denied' |
            ForEach-Object { $_.Line -replace '^\S*\\(src|tests|bench|fuzz|third_party)\\', '$1\' } |
            Where-Object { $_ -notmatch '^FAILED: ' } | Select-Object -Unique | Select-Object -First 40
          $tail = $lines | Select-Object -Last 25
          foreach ($pair in @(@('errors', $hits), @('log tail', $tail))) {
            $msg = (($pair[1] -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if ($msg.Length -gt 6000) { $msg = $msg.Substring(0, 6000) }
            "::error title=${{ matrix.preset }} ($($pair[0]))::$msg"
          }

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            ${{ env.BRIDGER_VCPKG_DIR }}/buildtrees/**/*.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore
