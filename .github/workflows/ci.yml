name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with vcpkg-configuration.json ("reference").
  VCPKG_TAG: "2026.07.29"
  # Not VCPKG_ROOT: the VS developer environment overwrites that with VS's bundled
  # (too old) vcpkg. The bootstrap step exports VCPKG_ROOT after msvc-dev-cmd runs.
  BRIDGER_VCPKG_DIR: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
  VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: msvc-asan        # unit tests under AddressSanitizer
            test: true
          - preset: msvc-release     # unit tests + benchmark smoke run
            test: true
            bench: true
          - preset: clangcl-release  # second compiler
            test: true
          - preset: msvc-debug       # build only
          - preset: clangcl-fuzz     # build fuzzers + short smoke run
            fuzz: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The desktop app's interface is built with npm (src/app/ui, docs/adr/0009).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/ui/package-lock.json

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ matrix.preset }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-${{ env.VCPKG_TAG }}-

      # vcpkg's own tool downloads (cmake, 7zip, ...) are cached too: fewer network
      # round-trips, and a transient GitHub 504 on a tool download no longer fails the job.
      - name: Restore vcpkg tool downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-${{ env.VCPKG_TAG }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE, $env:VCPKG_DOWNLOADS | Out-Null
          "VCPKG_ROOT before override: $env:VCPKG_ROOT" | Tee-Object -Append ci-step.log
          git -c advice.detachedHead=false clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg.git $env:BRIDGER_VCPKG_DIR 2>&1 | Tee-Object -Append ci-step.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:BRIDGER_VCPKG_DIR\bootstrap-vcpkg.bat" -disableMetrics 2>&1 | Tee-Object -Append ci-step.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:BRIDGER_VCPKG_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check clang-cl
        if: startsWith(matrix.preset, 'clangcl')
        shell: pwsh
        run: clang-cl --version

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} 2>&1 | Tee-Object -Append ci-step.log
          exit $LASTEXITCODE

      - name: Build
        shell: pwsh
        run: |
          # -k 0: keep going after a failure so one run reports every compile error.
          cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | Tee-Object -Append ci-step.log
          exit $LASTEXITCODE

      - name: Test
        if: matrix.test
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} 2>&1 | Tee-Object -Append ci-step.log
          exit $LASTEXITCODE

      - name: Benchmark smoke run
        if: matrix.bench
        shell: pwsh
        run: |
          Get-ChildItem build/${{ matrix.preset }}/bin/bridger_bench_*.exe | ForEach-Object {
            & $_.FullName --benchmark_min_time=0.05s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Fuzz smoke run (30 s per target)
        if: matrix.fuzz
        shell: pwsh
        run: |
          # Seeds per target (read-only); new inputs go to a scratch corpus dir.
          $seeds = @{ nbt = @('tests/data/nbt'); schem = @('tests/data/schem', 'tests/data/schem/malformed') }
          Get-ChildItem build/${{ matrix.preset }}/bin/bridger_fuzz_*.exe | ForEach-Object {
            $name = $_.BaseName -replace '^bridger_fuzz_', ''
            $corpus = "fuzz-corpus/$name"
            New-Item -ItemType Directory -Force $corpus | Out-Null
            # Arrays passed to a native command expand to one argument per element.
            [string[]]$extra = @()
            if ($seeds.ContainsKey($name)) { $extra = $seeds[$name] }
            & $_.FullName $corpus $extra -max_total_time=30 -print_final_stats=1 2>&1 | Tee-Object -Append ci-step.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Job logs need a signed-in account; annotations are public. Surface the error lines.
      - name: Report failure as annotation
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path ci-step.log)) { "::error title=${{ matrix.preset }}::failed before any logged step"; exit 0 }
          $lines = Get-Content ci-step.log
          # Unique compiler/linker diagnostics first (the same header error repeats per TU).
          $hits = $lines | Select-String -Pattern 'error[ :]|FAILED|fatal|denied' |
            ForEach-Object { $_.Line -replace '^\S*\\(src|tests|bench|fuzz|third_party)\\', '$1\' } |
            Where-Object { $_ -notmatch '^FAILED: ' } | Select-Object -Unique | Select-Object -First 40
          $tail = $lines | Select-Object -Last 25
          foreach ($pair in @(@('errors', $hits), @('log tail', $tail))) {
            $msg = (($pair[1] -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if ($msg.Length -gt 6000) { $msg = $msg.Substring(0, 6000) }
            "::error title=${{ matrix.preset }} ($($pair[0]))::$msg"
          }

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.preset }}
          path: |
            ${{ env.BRIDGER_VCPKG_DIR }}/buildtrees/**/*.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore

  # Linux and macOS: the libraries, the command line, the renderer and the desktop app (docs/adr/0010), with their tests
  # and a smoke test of the app (it starts, loads the interface and opens a file in the 3D preview).
  posix:
    name: ${{ matrix.os }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: posix-release   # unit tests + benchmark smoke run
            bench: true
          - os: ubuntu-24.04
            preset: posix-asan      # unit tests under AddressSanitizer + UBSan
          - os: macos-15
            preset: posix-release   # unit tests (Apple Silicon)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/ui/package-lock.json

      - name: Install build tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q
            # GTK 4 and WebKitGTK 6.0 for the app; Mesa's software Vulkan (llvmpipe), Xvfb and D-Bus for its smoke test.
            sudo apt-get install -y -q ninja-build zip unzip pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
              mesa-vulkan-drivers xvfb xauth dbus-x11
          else
            brew install ninja pkg-config molten-vk coreutils # coreutils: gtimeout
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ matrix.os }}-${{ matrix.preset }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ matrix.os }}-
            vcpkg-${{ env.VCPKG_TAG }}-${{ matrix.os }}-

      - name: Bootstrap vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS"
          git -c advice.detachedHead=false clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg.git "$BRIDGER_VCPKG_DIR"
          "$BRIDGER_VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$BRIDGER_VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} 2>&1 | tee -a ci-step.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | tee -a ci-step.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Test
        run: ctest --preset ${{ matrix.preset }} 2>&1 | tee -a ci-step.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: App smoke test
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0 # GTK, WebKit and AppKit keep process-lifetime allocations on purpose
        run: |
          file="$PWD/tests/data/ingame/containers.schem"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Ubuntu 24.04 runners forbid unprivileged user namespaces, which WebKit's sandbox (bubblewrap) needs.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- \
              build/${{ matrix.preset }}/bin/bridger-gui --smoke-test=1 "$file"
          else
            # MoltenVK goes into the bundle as in the release (a CI runner may have no GPU; the app still opens).
            app=build/${{ matrix.preset }}/bin/Bridger.app
            mkdir -p "$app/Contents/Frameworks"
            cp "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" "$app/Contents/Frameworks/"
            gtimeout 300 "$app/Contents/MacOS/Bridger" --smoke-test=1 "$file"
          fi

      - name: Benchmark smoke run
        if: matrix.bench
        shell: bash
        run: |
          for b in build/${{ matrix.preset }}/bin/bridger_bench_*; do "$b" --benchmark_min_time=0.05s || exit 1; done

      - name: Report failure as annotation
        if: failure()
        shell: bash
        run: |
          [ -f ci-step.log ] || { echo "::error title=${{ matrix.os }} ${{ matrix.preset }}::failed before any logged step"; exit 0; }
          msg=$(grep -E 'error[ :]|FAILED|fatal' ci-step.log | grep -v '^FAILED: ' | sort -u | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-6000)
          echo "::error title=${{ matrix.os }} ${{ matrix.preset }} (errors)::$msg"

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.os }}-${{ matrix.preset }}
          path: |
            ${{ env.BRIDGER_VCPKG_DIR }}/buildtrees/**/*.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore
